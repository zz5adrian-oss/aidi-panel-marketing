<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Aidi · Panel de consultas IDGroup</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --crema:#F6F2EA;
    --crema-suave:#EEE7D8;
    --tinta:#2B2620;
    --tinta-suave:#7A7266;
    --musgo:#59654A;
    --musgo-suave:#DEE3D4;
    --arcilla:#AD6A42;
    --linea:#E1D8C4;
    --blanco:#FFFEFB;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; overflow:hidden;}
  body{
    margin:0;
    background:var(--crema);
    color:var(--tinta);
    font-family:'Sora',sans-serif;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:620px;
    height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:24px 28px 0 28px;
  }
  .marca{
    display:flex;
    align-items:baseline;
    gap:2px;
    font-family:'Fraunces',serif;
    font-style:italic;
    font-size:22px;
    font-weight:500;
  }
  .marca .punto{ color:var(--arcilla); }
  .marca-grupo{ display:flex; align-items:center; gap:9px; }
  #mascota{ display:block; flex-shrink:0; }

  /* ---------- Mascota Aidi ---------- */
  @keyframes mascota-parpadeo-kf{ 0%,60%,100%{opacity:.2;} 30%{opacity:1;} }
  .mascota-punto{ width:5px; height:5px; border-radius:50%; background:var(--musgo); display:inline-block; animation:mascota-parpadeo-kf 1.2s infinite; }
  .mascota-parpadeo{ animation:mascota-parpadeo-kf 1.2s infinite; }
  @keyframes mascota-rebote-kf{ 0%,100%{transform:translateY(0);} 25%{transform:translateY(-5px);} 40%{transform:translateY(0);} 55%{transform:translateY(-2.5px);} 70%{transform:translateY(0);} }
  .mascota-rebote{ animation:mascota-rebote-kf .85s ease-in-out infinite; }
  @keyframes mascota-cae-kf{ 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(3px) rotate(-3deg);} }
  .mascota-cae{ animation:mascota-cae-kf 2.6s ease-in-out infinite; }
  @keyframes mascota-lagrima-kf{ 0%{transform:translateY(0);opacity:0;} 15%{opacity:1;} 75%{opacity:1;} 100%{transform:translateY(5px);opacity:0;} }
  .mascota-lagrima{ transform-box:fill-box; transform-origin:center; animation:mascota-lagrima-kf 1.5s ease-in infinite; }
  .mascota-puntos-estado{ display:flex; gap:3px; justify-content:center; margin-top:2px; height:6px; }
  @keyframes mascota-respira-kf{ 0%,100%{transform:translateY(0) scale(1) rotate(0deg);} 25%{transform:translateY(-2px) scale(1.02) rotate(-4deg);} 50%{transform:translateY(-3px) scale(1.04) rotate(0deg);} 75%{transform:translateY(-2px) scale(1.02) rotate(4deg);} }
  .mascota-respira{ animation:mascota-respira-kf 2.6s ease-in-out infinite; transform-origin:50% 65%; }
  @keyframes mascota-parpadeo-ojo-kf{ 0%,80%,100%{transform:scaleY(1);} 88%{transform:scaleY(.08);} 94%{transform:scaleY(1);} }
  .mascota-ojo-reposo{ transform-box:fill-box; transform-origin:center; animation:mascota-parpadeo-ojo-kf 3s ease-in-out infinite; }
  .estado{
    font-size:12px;
    color:var(--tinta-suave);
    text-align:right;
    line-height:1.4;
  }
  .estado .punto-verde{
    display:inline-block;
    width:6px;height:6px;
    border-radius:50%;
    background:var(--musgo);
    margin-right:5px;
    animation:pulso-verde-kf 2.2s ease-in-out infinite;
  }
  @keyframes pulso-verde-kf{
    0%,100%{ box-shadow:0 0 0 0 rgba(89,101,74,.45); }
    50%{ box-shadow:0 0 0 4px rgba(89,101,74,0); }
  }

  /* ---------- Hero / saludo ---------- */
  .hero{
    position:relative;
    padding:24px 28px 24px 28px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    text-align:left;
    flex:1;
    min-height:0;
  }
  .hero.compacta .hero-espaciador{ flex:0 0 0 !important; }
  .hero.compacta{
    flex:0 0 auto;
    padding-top:28px;
    padding-bottom:8px;
  }
  .hero-contenido{
    position:relative;
    width:100%;
  }
  .brote{
    position:absolute;
    top:-38px; right:-30px;
    width:170px; height:170px;
    opacity:.55;
    pointer-events:none;
    transform-box:fill-box;
    transform-origin:50% 100%;
    animation:planta-viento-kf 4.2s ease-in-out infinite;
  }
  @keyframes planta-viento-kf{
    0%,100%{ transform:rotate(-2.5deg); }
    50%{ transform:rotate(2.5deg); }
  }
  .saludo{
    font-size:15px;
    color:var(--tinta-suave);
    margin-bottom:6px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:400;
    font-size:38px;
    line-height:1.12;
    margin:0 0 14px 0;
    max-width:9.5em;
    position:relative;
  }
  h1 em{
    font-style:italic;
    font-weight:500;
    color:var(--musgo);
  }
  .sub{
    font-size:14.5px;
    color:var(--tinta-suave);
    max-width:34em;
    margin:0 0 22px 0;
  }

  /* ---------- Chips de temas ---------- */
  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:8px;
    justify-content:flex-start;
  }
  .chip{
    font-family:'Sora',sans-serif;
    font-size:13px;
    font-weight:500;
    color:var(--tinta);
    background:var(--blanco);
    border:1px solid var(--linea);
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    transition:background .15s ease, border-color .15s ease;
  }
  .chip:hover{ border-color:var(--musgo); }
  .chip.activo{
    background:var(--musgo);
    border-color:var(--musgo);
    color:var(--blanco);
  }

  /* ---------- Conversación ---------- */
  .conversacion{
    padding:22px 28px 130px 28px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    overflow-y:auto;
  }
  .conversacion.vacia{ display:none; }
  .conversacion:not(.vacia){ flex:1; min-height:0; }
  .conversacion .msg{ align-self:center; }
  .conversacion .msg.usuario{ align-self:flex-end; }
  .conversacion .msg.aidi{ align-self:flex-start; }
  .conversacion{
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  .conversacion::-webkit-scrollbar{
    display:none;
  }

  .msg{
    max-width:78%;
    padding:12px 16px;
    border-radius:16px;
    font-size:14.5px;
    line-height:1.5;
  }
  .msg.usuario{
    align-self:flex-end;
    background:var(--tinta);
    color:var(--crema);
    border-bottom-right-radius:4px;
  }
  .msg.aidi{
    align-self:flex-start;
    background:var(--crema-suave);
    color:var(--tinta);
    border-bottom-left-radius:4px;
  }
  .msg.aidi .emoji-lead{
    margin-right:4px;
  }
  .adjunto{
    margin-top:10px;
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--blanco);
    border:1px solid var(--linea);
    border-radius:12px;
    padding:9px 12px;
    font-size:12.5px;
    color:var(--tinta-suave);
  }
  .adjunto .icono{
    width:30px;height:30px;
    border-radius:8px;
    background:var(--musgo-suave);
    display:flex;align-items:center;justify-content:center;
    font-size:15px;
    flex-shrink:0;
  }
  .adjunto b{ color:var(--tinta); font-weight:600; display:block; }

  .escribiendo{
    align-self:flex-start;
    display:flex;
    gap:4px;
    padding:14px 16px;
    background:var(--crema-suave);
    border-radius:16px;
    border-bottom-left-radius:4px;
  }
  .escribiendo span{
    width:6px;height:6px;border-radius:50%;
    background:var(--tinta-suave);
    animation:parpadeo 1.1s infinite ease-in-out;
  }
  .escribiendo span:nth-child(2){animation-delay:.15s;}
  .escribiendo span:nth-child(3){animation-delay:.3s;}
  @keyframes parpadeo{
    0%,80%,100%{opacity:.25; transform:translateY(0);}
    40%{opacity:1; transform:translateY(-2px);}
  }

  /* ---------- Input ---------- */
  .barra-input{
    position:sticky;
    bottom:0;
    padding:16px 28px 22px 28px;
    background:linear-gradient(180deg, rgba(246,242,234,0) 0%, var(--crema) 35%);
  }
  .campo{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--blanco);
    border:1px solid var(--linea);
    border-radius:999px;
    padding:6px 6px 6px 18px;
  }
  .campo input{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    font-family:'Sora',sans-serif;
    font-size:14.5px;
    color:var(--tinta);
    padding:8px 0;
  }
  .campo input::placeholder{ color:var(--tinta-suave); }
  .enviar{
    width:38px;height:38px;
    border-radius:50%;
    border:none;
    background:var(--tinta);
    color:var(--crema);
    font-size:16px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    transition:background .15s ease;
  }
  .enviar:hover{ background:var(--musgo); }

  @media (max-width:480px){
    header, .hero, .conversacion, .barra-input{ padding-left:18px; padding-right:18px; }
    h1{ font-size:30px; }
    .brote{ width:150px; height:150px; top:-20px; right:-30px; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div></div>
    <div class="estado"><span class="punto-verde"></span>Full actualizado hace 4 min</div>
  </header>

  <div class="hero">
    <div class="hero-espaciador" style="flex:1;"></div>
    <div class="hero-contenido">
      <svg class="brote" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <path d="M100 172 C100 128 100 90 100 30" stroke="#59654A" stroke-width="2" fill="none"/>
        <path d="M100 60 C70 50 55 25 60 5 C90 10 105 35 100 60Z" fill="#3F4F36"/>
        <path d="M100 90 C130 78 148 50 145 25 C112 32 96 60 100 90Z" fill="#59654A"/>
        <path d="M100 120 C72 112 55 88 58 65 C88 70 103 95 100 120Z" fill="#8A9678"/>
        <path d="M82 172 L88 200 L112 200 L118 172 Z" stroke="#7A7266" stroke-width="2" fill="none" stroke-linejoin="round"/>
      </svg>
      <div class="marca-grupo" style="margin-bottom:14px;">
        <div id="mascota"></div>
        <div class="marca">ai<span class="punto">·</span>di</div>
      </div>
      <div class="saludo">Hola Lari 👋</div>
      <h1>¿Qué<br>resolvemos <em>hoy</em>?</h1>
      <p class="sub">Contame qué necesitás — cupones, difusión, relámpago, Domup o cómo viene Full — y te tiro la posta al toque.</p>

      <div class="chips" id="chips">
        <button class="chip" data-tema="cupones">🎟️ Cupones</button>
        <button class="chip" data-tema="difusion">📣 Difusión</button>
        <button class="chip" data-tema="relampago">⚡ Relámpago</button>
        <button class="chip" data-tema="promos">🗂️ Central de Promos</button>
        <button class="chip" data-tema="full">🏭 Full</button>
        <button class="chip" data-tema="domup">🚀 Domup</button>
        <button class="chip" data-tema="otro">💬 Otro</button>
      </div>
    </div>
    <div class="hero-espaciador" style="flex:1;"></div>
  </div>

  <div class="conversacion vacia" id="conversacion">
  </div>

  <div class="barra-input">
    <div class="campo">
      <input id="input" type="text" placeholder="Escribime lo que necesitás…">
      <button class="enviar" id="enviar">➤</button>
    </div>
  </div>

</div>

<script>
const conversacion = document.getElementById('conversacion');
const input = document.getElementById('input');
const enviar = document.getElementById('enviar');
const chips = document.querySelectorAll('.chip');

const respuestas = {
  cupones: '🎟️ Decime el mes y te tiro el consumo de BASE PLATA y BASE % al toque.',
  promos: '🗂️ ¿Querés el estado de la Central de Promociones o alguna queja puntual de un vendedor?',
  difusion: '📣 Contame qué campaña de difusión querés revisar y te traigo el alcance.',
  relampago: '⚡ ¿Querés ver las ofertas relámpago activas o programar una nueva?',
  domup: '🚀 Te tiro el estado de la campaña Domup en un toque, decime qué necesitás puntualmente.',
  full: '🏭 Puedo contarte estado de una orden, Pareto de producción o qué se está por quedar sin stock.',
  otro: '💬 Contame con tus palabras, voy viendo a qué tema corresponde.'
};

function scrollAbajo(){
  conversacion.scrollTop = conversacion.scrollHeight;
}

function agregarMensaje(texto, quien){
  conversacion.classList.remove('vacia');
  document.querySelector('.hero').classList.add('compacta');
  const div = document.createElement('div');
  div.className = 'msg ' + quien;
  div.innerHTML = texto;
  conversacion.appendChild(div);
  scrollAbajo();
}

// ---------- Mascota Aidi (reposo / pensando / encontré / sin stock) ----------
const mascotaEl = document.getElementById('mascota');

const mascotas = {
  reposo: `
    <div class="mascota-respira">
      <svg width="30" height="30" viewBox="0 0 34 34">
        <circle cx="17" cy="18" r="14" fill="var(--musgo-suave)"></circle>
        <circle cx="5" cy="10" r="4" fill="var(--musgo-suave)"></circle>
        <circle cx="29" cy="10" r="4" fill="var(--musgo-suave)"></circle>
        <rect x="12" y="14" width="3" height="9" rx="1.5" fill="var(--musgo)" class="mascota-ojo-reposo" style="animation-delay:0s;"></rect>
        <rect x="19" y="14" width="3" height="9" rx="1.5" fill="var(--musgo)" class="mascota-ojo-reposo" style="animation-delay:0s;"></rect>
      </svg>
    </div>`,
  pensando: `
    <svg width="30" height="30" viewBox="0 0 34 34">
      <circle cx="17" cy="18" r="14" fill="var(--musgo-suave)"></circle>
      <circle cx="5" cy="10" r="4" fill="var(--musgo-suave)"></circle>
      <circle cx="29" cy="10" r="4" fill="var(--musgo-suave)"></circle>
      <circle cx="13.5" cy="18.5" r="1.6" fill="var(--musgo)"></circle>
      <circle cx="20.5" cy="18.5" r="1.6" fill="var(--musgo)"></circle>
      <circle cx="24" cy="12" r="1.1" fill="var(--musgo)" class="mascota-parpadeo" style="animation-delay:0s;"></circle>
      <circle cx="26.5" cy="9" r="0.9" fill="var(--musgo)" class="mascota-parpadeo" style="animation-delay:.2s;"></circle>
      <circle cx="28.5" cy="6.5" r="0.7" fill="var(--musgo)" class="mascota-parpadeo" style="animation-delay:.4s;"></circle>
    </svg>`,
  encontre: `
    <div class="mascota-rebote">
      <svg width="30" height="30" viewBox="0 0 34 34">
        <circle cx="17" cy="18" r="14" fill="#DCEFD8"></circle>
        <circle cx="5" cy="10" r="4" fill="#DCEFD8"></circle>
        <circle cx="29" cy="10" r="4" fill="#DCEFD8"></circle>
        <path d="M 12 18.5 Q 13.5 21 15 18.5" stroke="#3E8F4B" stroke-width="2.2" fill="none" stroke-linecap="round"></path>
        <path d="M 19 18.5 Q 20.5 21 22 18.5" stroke="#3E8F4B" stroke-width="2.2" fill="none" stroke-linecap="round"></path>
      </svg>
    </div>`,
  sinstock: `
    <div class="mascota-cae">
      <svg width="30" height="30" viewBox="0 0 34 34">
        <circle cx="17" cy="18" r="14" fill="#F3D9CE"></circle>
        <circle cx="5" cy="10" r="4" fill="#F3D9CE"></circle>
        <circle cx="29" cy="10" r="4" fill="#F3D9CE"></circle>
        <path d="M 12 18 Q 13.5 19.5 15 18" stroke="var(--arcilla)" stroke-width="2.2" fill="none" stroke-linecap="round"></path>
        <path d="M 19 18 Q 20.5 19.5 22 18" stroke="var(--arcilla)" stroke-width="2.2" fill="none" stroke-linecap="round"></path>
        <ellipse cx="13" cy="20" rx="1.1" ry="1.7" fill="var(--arcilla)" class="mascota-lagrima" style="animation-delay:0s;"></ellipse>
        <ellipse cx="21" cy="20" rx="1.1" ry="1.7" fill="var(--arcilla)" class="mascota-lagrima" style="animation-delay:.7s;"></ellipse>
      </svg>
    </div>`
};

function ponerMascota(estado, puntitos){
  mascotaEl.innerHTML = mascotas[estado] +
    (puntitos ? '<div class="mascota-puntos-estado"><span class="mascota-punto" style="animation-delay:0s;"></span><span class="mascota-punto" style="animation-delay:.2s;"></span><span class="mascota-punto" style="animation-delay:.4s;"></span></div>' : '');
}

ponerMascota('reposo');

function mostrarEscribiendo(){
  const div = document.createElement('div');
  div.className = 'escribiendo';
  div.id = 'escribiendo';
  div.innerHTML = '<span></span><span></span><span></span>';
  conversacion.appendChild(div);
  scrollAbajo();
}

function ocultarEscribiendo(){
  const el = document.getElementById('escribiendo');
  if (el) el.remove();
}

const WEBHOOK_URL = 'https://adrianzz5.app.n8n.cloud/webhook/aidi';

async function responderPor(texto){
  ponerMascota('pensando', true);
  mostrarEscribiendo();
  try {
    const res = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ mensaje: texto })
    });
    const data = await res.json();
    ocultarEscribiendo();
    agregarMensaje(data.texto || '🤔 No me llegó respuesta, revisá el workflow.', 'aidi');
    ponerMascota('encontre');
  } catch (err) {
    ocultarEscribiendo();
    agregarMensaje('⚠️ No pude conectarme con el servidor. Probá de nuevo en un rato.', 'aidi');
    ponerMascota('sinstock');
  }
  setTimeout(() => ponerMascota('reposo'), 1400);
}

function enviarMensaje(texto){
  if (!texto.trim()) return;
  agregarMensaje(texto, 'usuario');
  input.value = '';
  responderPor(texto);
}

enviar.addEventListener('click', () => enviarMensaje(input.value));
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') enviarMensaje(input.value); });

chips.forEach(chip => {
  chip.addEventListener('click', () => {
    chips.forEach(c => c.classList.remove('activo'));
    chip.classList.add('activo');
    const tema = chip.dataset.tema;
    agregarMensaje(chip.textContent.trim(), 'usuario');
    responderPor(tema);
  });
});
</script>
</body>
</html>
